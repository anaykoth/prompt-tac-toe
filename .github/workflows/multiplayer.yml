name: Multiplayer regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: joust_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JOUST_TEST_DATABASE_URL: postgres://postgres:isolated-test-password@127.0.0.1:5432/joust_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            games/muppet-games/package-lock.json
      - run: npm ci
      - run: npm --prefix games/muppet-games ci
      - name: Migrate isolated database
        run: |
          for migration in supabase/migrations/*.sql; do
            psql "$JOUST_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: npm test && npm run test:shared && npm run test:darts && npm run test:joust && npm run test:sql
      - run: npm --prefix games/muppet-games test
      - run: npm run build
      - name: Build persistent game host
        run: docker build -f games/muppet-games/Dockerfile -t multiplayer-test .
